server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: securops-core
  datasource:
    url: jdbc:h2:mem:securopsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

securops:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  sync:
    node-id: "CENTRAL-HQ-01"
    is-central: true
    batch-size: 100
    retry-max-attempts: 5
  payroll:
    night-shift-start-hour: 21 # 21:00
    night-shift-end-hour: 6    # 06:00
    overtime-threshold-hours: 8
